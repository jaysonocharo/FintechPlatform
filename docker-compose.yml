services: 
  # Microsoft SQL Server Database Service
  fintech-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fintech_mssql_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Alleged_then7
      - MSSQL_PID=Express
    ports:
      - "1433:1433" # Standard SQL Server Port
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Alleged_then7' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Alleged_then7' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fintech-network

  # .NET 8 Backend API Service
  fintech-backend:
    build:
      context: ./FintechBackend
      dockerfile: Dockerfile
    container_name: fintech_api_backend
    restart: always
    ports:
      - "5272:8080" # Map host port 5272 to container port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=fintech-db,1433;Database=FintechDb;User Id=sa;Password=Alleged_then7;TrustServerCertificate=True;
      - JwtSettings__Secret=POW7Wb124v2cGgTpi3Bzx+mVxzz9aTjQNgPdMb8TYhBwiEL58Ml6HkaCXOViv+wVRNHDGaEkTGMPWT1xwWa8Rw==
      - JwtSettings__Issuer=FintechBackend
      - JwtSettings__Audience=FintechFrontend
      - AdminConfig__DefaultEmail=admin@example.com
      - AdminConfig__DefaultPassword=Pass@word1
    depends_on:
      fintech-db:
        condition: service_healthy
    networks:
      - fintech-network

volumes:
  mssql_data:
    driver: local
  dp_keys:
    driver: local

networks:
  fintech-network:
    driver: bridge