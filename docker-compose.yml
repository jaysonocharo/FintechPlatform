services: 
  # Microsoft SQL Server Database Service
  fintech-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fintech_mssql_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433" # Standard SQL Server Port
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Alleged_then7' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Alleged_then7' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fintech-network

  # .NET 8 Backend API Service
  fintech-backend:
    build:
      context: ./FintechBackend
      dockerfile: Dockerfile
    container_name: fintech_api_backend
    restart: always
    ports:
      - "5272:8080" # Map host port 5272 to container port 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - AdminConfig__DefaultEmail=${ADMIN_DEFAULT_EMAIL}
      - AdminConfig__DefaultPassword=${ADMIN_DEFAULT_PASSWORD}
    depends_on:
      fintech-db:
        condition: service_healthy
    networks:
      - fintech-network

volumes:
  mssql_data:
    driver: local
  dp_keys:
    driver: local

networks:
  fintech-network:
    driver: bridge